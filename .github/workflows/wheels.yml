name: Build Python wheels
on:
  push:
    # build wheels for releases and prereleases
    # this workflow assumes that the same branch already exists in the QuantLib repo
    tags:
      - 'v1.[0-9]+'
      - 'v1.[0-9]+.[0-9]+'
      - 'v1.[0-9]+-rc'
      - 'v1.[0-9]+.[0-9]+-rc'
      
  workflow_dispatch:
    # manual runs to try out changes in the workflow
    inputs:
      qlref:
        description: 'QuantLib tag or branch to use'
        required: true
      qlswigref:
        description: 'QuantLib-SWIG tag or branch to use'
        required: true

jobs:
  # making tarballs sidesteps the problem of installing the desired SWIG version on all systems
  make-tarballs:
    runs-on: ubuntu-latest
    steps:
    - name: Determine tag or branch to build
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "QLREF=${{ github.event.inputs.qlref }}" | tee -a $GITHUB_ENV
            echo "QLSWIGREF=${{ github.event.inputs.qlswigref }}" | tee -a $GITHUB_ENV
        else
            echo "QLREF=${{ github.ref_name }}" | tee -a $GITHUB_ENV
            echo "QLSWIGREF=${{ github.ref_name }}" | tee -a $GITHUB_ENV
        fi
    - name: Setup
      env:
        SWIG_VERSION: 4.5.1
      run: |
        sudo apt update
        sudo apt install -y libpcre2-dev libboost-dev tofrodos
        wget http://downloads.sourceforge.net/project/swig/swig/swig-${SWIG_VERSION}/swig-${SWIG_VERSION}.tar.gz \
            && tar xfz swig-${SWIG_VERSION}.tar.gz \
            && rm swig-${SWIG_VERSION}.tar.gz \
            && cd swig-${SWIG_VERSION} \
            && ./configure --prefix=/usr CXXFLAGS=-O3 \
            && make -j 4 && sudo make install \
            && cd .. && rm -rf swig-${SWIG_VERSION}
    - uses: actions/checkout@v7
      with:
        repository: lballabio/QuantLib
        ref: ${{ env.QLREF }}
        path: quantlib
        fetch-depth: 0
        fetch-tags: true
    - name: Make tarballs for QuantLib
      run: |
        cd quantlib
        ./autogen.sh
        ./configure
        make dist
        mkdir ../tarballs
        mv QuantLib-*.tar.gz ../tarballs
        cd ../tarballs && ../quantlib/tools/tgz2zip QuantLib-*.tar.gz && ls -lh
    - uses: actions/checkout@v7
      with:
        repository: lballabio/QuantLib-SWIG
        ref: ${{ env.QLSWIGREF }}
        path: quantlib-swig
        fetch-depth: 0
        fetch-tags: true
    - name: Make tarballs for QuantLib-SWIG
      run: |
        cd quantlib-swig
        ./autogen.sh
        ./configure
        make dist
        mv QuantLib-SWIG-*.tar.gz ../tarballs
        cd ../tarballs && ../quantlib-swig/tools/tgz2zip QuantLib-SWIG-*.tar.gz && ls -lh
    - uses: actions/upload-artifact@v7
      with:
        name: tarballs
        path: ./tarballs/*

  detect-version:
    runs-on: ubuntu-latest
    needs: make-tarballs
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - id: version
      run: |
        echo "version=`ls QuantLib-1*.tar.gz | sed 's/QuantLib-//' | sed 's/\.tar\.gz//'`" | tee -a "$GITHUB_OUTPUT"

  wheels-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    needs: detect-version
    steps:
    - uses: actions/checkout@v7
    - name: Setup
      run: |
        brew install boost
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Build QuantLib
      run: |
        tar xfz QuantLib-${{ needs.detect-version.outputs.version }}.tar.gz
        cd QuantLib-${{ needs.detect-version.outputs.version }}/
        ./configure --disable-shared --with-boost-include=`brew --prefix`/include --enable-unity-build --disable-test-suite --enable-skip-examples
        make -j3 CXXFLAGS="-std=c++17 -g0 -O3 -fno-common -dynamic -DNDEBUG -fwrapv" LDFLAGS="-fno-common -dynamic -DNDEBUG -fwrapv"
        sudo make install
    - name: Unpack QuantLib-SWIG
      run: |
        tar xfz QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.tar.gz
    - name: Build QuantLib wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        CIBW_SKIP: cp3??t-*
        CIBW_ENABLE: pypy
        CXXFLAGS: -std=c++17 -g0 -O3
        MACOSX_DEPLOYMENT_TARGET: 10.13
        CIBW_BUILD_VERBOSITY: 2
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {package}/test
      with:
        package-dir: ./QuantLib-SWIG-${{ needs.detect-version.outputs.version }}/Python
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  wheels-macos-nogil:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    needs: detect-version
    steps:
    - uses: actions/checkout@v7
    - name: Setup
      run: |
        brew install boost
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Build QuantLib
      run: |
        tar xfz QuantLib-${{ needs.detect-version.outputs.version }}.tar.gz
        cd QuantLib-${{ needs.detect-version.outputs.version }}/
        ./configure --disable-shared --with-boost-include=`brew --prefix`/include --enable-unity-build --enable-thread-safe-observer-pattern --enable-sessions --disable-test-suite --enable-skip-examples
        make -j3 CXXFLAGS="-std=c++17 -g0 -O3 -fno-common -dynamic -DNDEBUG -fwrapv" LDFLAGS="-fno-common -dynamic -DNDEBUG -fwrapv"
        sudo make install
    - name: Unpack QuantLib-SWIG
      run: |
        tar xfz QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.tar.gz
    - name: Build QuantLib wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        CIBW_BUILD: cp3??t-*
        CXXFLAGS: -std=c++17 -g0 -O3
        MACOSX_DEPLOYMENT_TARGET: 10.13
        CIBW_BUILD_VERBOSITY: 2
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {package}/test
      with:
        package-dir: ./QuantLib-SWIG-${{ needs.detect-version.outputs.version }}/Python
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-nogil-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  wheels-windows:
    runs-on: windows-2022
    needs: detect-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
    - uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup Boost
      run: |
        $Url = "https://archives.boost.io/release/1.90.0/source/boost_1_90_0.zip"
        (New-Object System.Net.WebClient).DownloadFile($Url, "$RUNNER_TEMP\boost.zip")
        Expand-Archive -Path "$RUNNER_TEMP\boost.zip" -DestinationPath C:\local
        Rename-Item -Path "C:\local\boost_1_90_0" -NewName "boost"
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Build QuantLib
      run: |
        Expand-Archive -Path QuantLib-${{ needs.detect-version.outputs.version }}.zip -DestinationPath C:\local
        Copy-Item .ci\Build.props C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\
        Copy-Item .ci\Directory.Build.props C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\
        cd C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\
        msbuild QuantLib.vcxproj -p:Configuration="Release (static runtime)" -p:Platform=${{ matrix.platform }}
        dir lib
    - name: Unpack QuantLib-SWIG
      run: |
        Expand-Archive -Path QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.zip -DestinationPath .
    - name: Build QuantLib wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        QL_DIR: C:\local\QuantLib-${{ needs.detect-version.outputs.version }}
        INCLUDE: C:\local\boost
        QL_STATIC_RUNTIME: 1
        CIBW_SKIP: cp3??t-*
        CIBW_ENABLE: pypy
        CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
        CIBW_BUILD_VERBOSITY: 2
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {package}/test
      with:
        package-dir: ./QuantLib-SWIG-${{ needs.detect-version.outputs.version }}/Python
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-windows-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  wheels-windows-nogil:
    runs-on: windows-2022
    needs: detect-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
    - uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup Boost
      run: |
        $Url = "https://archives.boost.io/release/1.90.0/source/boost_1_90_0.zip"
        (New-Object System.Net.WebClient).DownloadFile($Url, "$RUNNER_TEMP\boost.zip")
        Expand-Archive -Path "$RUNNER_TEMP\boost.zip" -DestinationPath C:\local
        Rename-Item -Path "C:\local\boost_1_90_0" -NewName "boost"
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Build QuantLib
      run: |
        Expand-Archive -Path QuantLib-${{ needs.detect-version.outputs.version }}.zip -DestinationPath C:\local
        Copy-Item .ci\Build.props C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\
        Copy-Item .ci\Directory.Build.props C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\
        Copy-Item .ci\wheels\userconfig_nogil.hpp C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\ql\userconfig.hpp
        cd C:\local\QuantLib-${{ needs.detect-version.outputs.version }}\
        msbuild QuantLib.vcxproj -p:Configuration="Release (static runtime)" -p:Platform=${{ matrix.platform }}
        dir lib
    - name: Unpack QuantLib-SWIG
      run: |
        Expand-Archive -Path QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.zip -DestinationPath .
    - name: Build QuantLib wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        QL_DIR: C:\local\QuantLib-${{ needs.detect-version.outputs.version }}
        INCLUDE: C:\local\boost
        QL_STATIC_RUNTIME: 1
        CIBW_BUILD: cp3??t-*
        CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
        CIBW_BUILD_VERBOSITY: 2
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {package}/test
      with:
        package-dir: ./QuantLib-SWIG-${{ needs.detect-version.outputs.version }}/Python
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-nogil-windows-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  wheels-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: manylinux
            os: ubuntu-24.04
          - arch: x86_64
            image: musllinux
            os: ubuntu-24.04
          - arch: i686
            image: manylinux
            os: ubuntu-24.04
          - arch: i686
            image: musllinux
            os: ubuntu-24.04
          - arch: aarch64
            image: manylinux
            os: ubuntu-24.04-arm
          - arch: aarch64
            image: musllinux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: detect-version
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Unpack QuantLib and QuantLib-SWIG
      run: |
        tar xfz QuantLib-${{ needs.detect-version.outputs.version }}.tar.gz
        tar xfz QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.tar.gz
    - name: Build QuantLib wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        CIBW_BUILD: "*-${{ matrix.image }}*"
        CIBW_SKIP: cp3??t-*
        CIBW_ENABLE: pypy
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        CIBW_BUILD_VERBOSITY: 2
        CIBW_BEFORE_ALL_LINUX: .ci/wheels/before_all_linux.sh
        CIBW_ENVIRONMENT_LINUX: CXXFLAGS=${{ matrix.arch == 'i686' && '"-O0 -g0"' || '"-O3 -g0"' }} CXXQLFLAGS="-O3 -g0"
        CIBW_ENVIRONMENT_PASS_LINUX: CXXFLAGS CXXQLFLAGS
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {package}/test
      with:
        package-dir: ./QuantLib-SWIG-${{ needs.detect-version.outputs.version }}/Python
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-linux-${{ matrix.image }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  wheels-linux-nogil:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: manylinux
            os: ubuntu-24.04
          - arch: x86_64
            image: musllinux
            os: ubuntu-24.04
          - arch: i686
            image: manylinux
            os: ubuntu-24.04
          - arch: i686
            image: musllinux
            os: ubuntu-24.04
          - arch: aarch64
            image: manylinux
            os: ubuntu-24.04-arm
          - arch: aarch64
            image: musllinux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: detect-version
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Unpack QuantLib and QuantLib-SWIG
      run: |
        tar xfz QuantLib-${{ needs.detect-version.outputs.version }}.tar.gz
        tar xfz QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.tar.gz
    - name: Build QuantLib wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        CIBW_BUILD: "cp3??t-${{ matrix.image }}*"
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        CIBW_BUILD_VERBOSITY: 2
        CIBW_BEFORE_ALL_LINUX: .ci/wheels/before_all_linux_nogil.sh
        CIBW_ENVIRONMENT_LINUX: CXXFLAGS=${{ matrix.arch == 'i686' && '"-O0 -g0"' || '"-O3 -g0"' }} CXXQLFLAGS="-O3 -g0"
        CIBW_ENVIRONMENT_PASS_LINUX: CXXFLAGS CXXQLFLAGS
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {package}/test
      with:
        package-dir: ./QuantLib-SWIG-${{ needs.detect-version.outputs.version }}/Python
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-nogil-linux-${{ matrix.image }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  wheels-wasm:
    runs-on: ubuntu-24.04
    needs: detect-version
    steps:
    - uses: actions/checkout@v7
    - name: Setup system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Pyodide build tools
      run: |
        pip install --upgrade pip
        pip install setuptools pyodide-build build wheel
        pyodide xbuildenv install 0.27.8
        pyodide xbuildenv install-emscripten
    - uses: actions/download-artifact@v8
      with:
        name: tarballs
        path: .
    - name: Unpack QuantLib and QuantLib-SWIG
      run: |
        tar xfz QuantLib-${{ needs.detect-version.outputs.version }}.tar.gz
        tar xfz QuantLib-SWIG-${{ needs.detect-version.outputs.version }}.tar.gz
    - name: Build QuantLib
      run: |
        VERSION="${{ needs.detect-version.outputs.version }}"
        QL_DIR="${GITHUB_WORKSPACE}/QuantLib-${VERSION}"
        QL_INSTALL_DIR="${GITHUB_WORKSPACE}/ql-wasm-install"

        # Isolate Boost to prevent host glibc header pollution in Emscripten
        mkdir -p /tmp/boost/include
        ln -sfn /usr/include/boost /tmp/boost/include/boost

        if ! command -v emcmake &>/dev/null; then
          EMSDK_EMCMAKE=$(find "$HOME/.cache/pyodide-build" -name emcmake 2>/dev/null | head -n 1)
          if [ -z "${EMSDK_EMCMAKE}" ]; then
            EMSDK_EMCMAKE=$(find "$(python -c "from pyodide_build.common import default_xbuildenv_path; print(default_xbuildenv_path())" 2>/dev/null)" -name emcmake 2>/dev/null | head -n 1)
          fi
          if [ -n "${EMSDK_EMCMAKE}" ]; then
            export PATH="$(dirname "${EMSDK_EMCMAKE}"):$PATH"
          fi
        fi

        mkdir -p "${QL_DIR}/build-wasm"
        emcmake cmake -B "${QL_DIR}/build-wasm" -S "${QL_DIR}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DQL_BUILD_EXAMPLES=OFF \
          -DQL_BUILD_TEST_SUITE=OFF \
          -DQL_BUILD_BENCHMARK=OFF \
          -DCMAKE_UNITY_BUILD=ON \
          -DCMAKE_UNITY_BUILD_BATCH_SIZE=16 \
          -DBoost_INCLUDE_DIR="/tmp/boost/include" \
          -DCMAKE_INSTALL_PREFIX="${QL_INSTALL_DIR}" \
          -DCMAKE_CXX_FLAGS="-fexceptions -O3 -DNDEBUG"

        cmake --build "${QL_DIR}/build-wasm" --target install -j $(nproc)
    - name: Build QuantLib wheels
      run: |
        VERSION="${{ needs.detect-version.outputs.version }}"
        QL_INSTALL_DIR="${GITHUB_WORKSPACE}/ql-wasm-install"
        WHEELHOUSE="${GITHUB_WORKSPACE}/wheelhouse"
        mkdir -p "${WHEELHOUSE}"

        cd "${GITHUB_WORKSPACE}/QuantLib-SWIG-${VERSION}/Python"
        export PATH="${QL_INSTALL_DIR}/bin:$PATH"
        export CXXFLAGS="-I/tmp/boost/include"

        pyodide build --no-isolation --exports whole_archive --outdir "${WHEELHOUSE}"

        # Ensure wheel is compatible with Pyodide 0.27 (emscripten_3_1_58) for local check
        cd "${WHEELHOUSE}"
        for f in *cp312*pyemscripten*.whl; do
          if [ -f "$f" ]; then
            cp "$f" "$(echo "$f" | sed -E 's/pyemscripten_[0-9]+_[0-9]+/emscripten_3_1_58/g')"
          fi
        done
        ls -la "${WHEELHOUSE}"
    - name: Check
      run: |
        ./.ci/pythonWebAssembly.check "${GITHUB_WORKSPACE}/wheelhouse"
    - name: Clean up non-standard wheel aliases for PyPI publish
      run: |
        rm -f "${GITHUB_WORKSPACE}/wheelhouse"/*emscripten_*.whl
        ls -la "${GITHUB_WORKSPACE}/wheelhouse"
    - name: Save wheels as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-wasm
        path: ./wheelhouse/*.whl

  test-publish:
    runs-on: ubuntu-latest
    needs: [ wheels-macos, wheels-macos-nogil, wheels-windows, wheels-windows-nogil, wheels-linux, wheels-linux-nogil, wheels-wasm ]
    environment: testpypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
    - name: Collect wheels
      run: |
        mkdir ./wheelhouse
        cp ./wheels-*/*.whl ./wheelhouse
        ls -l ./wheelhouse
    - name: Publish package to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: ./wheelhouse
        skip-existing: true

  publish:
    runs-on: ubuntu-latest
    needs: test-publish
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
    - name: Collect wheels
      run: |
        mkdir ./wheelhouse
        cp ./wheels-*/*.whl ./wheelhouse
        ls -l ./wheelhouse
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ./wheelhouse
        skip-existing: true
