name: Linux build
on:
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
          - language: java
            config: -old
          - language: java
            config: -new
          - language: csharp
          - language: r
          - language: scala
    container: ghcr.io/lballabio/quantlib-swig-devenv:${{ matrix.language }}
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        ./.ci/${{ matrix.language }}${{ matrix.config }}.build
    - name: Install
      run: |
        ./.ci/${{ matrix.language }}${{ matrix.config }}.install
    - name: Check
      run: |
        ./.ci/${{ matrix.language }}${{ matrix.config }}.check

  wasm:
    name: build (python, WebAssembly)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Checkout QuantLib
      uses: actions/checkout@v7
      with:
        repository: lballabio/QuantLib
        path: QuantLib
    - name: Setup system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev swig
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Pyodide build tools
      run: |
        pip install --upgrade pip
        pip install setuptools pyodide-build build wheel
        pyodide xbuildenv install
        pyodide xbuildenv install-emscripten
    - name: Build
      run: |
        QL_SRC_DIR="${GITHUB_WORKSPACE}/QuantLib" bash .ci/wasm/build_wasm.sh
    - name: Check
      run: |
        cd .ci/wasm
        npm install
        node test_wasm.mjs
